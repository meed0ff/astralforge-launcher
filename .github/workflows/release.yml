name: Build Portable Releases (Windows & Linux)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows Portable (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache (launcher)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "launcher/src-tauri"

      - name: Rust cache (manifest-gen-gui)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "manifest-gen-gui/src-tauri"

      - name: Build Eternum Launcher (portable)
        working-directory: launcher
        run: |
          npm ci
          npx tauri build --no-bundle

      - name: Build Eternum Modpack Manager (portable)
        working-directory: manifest-gen-gui
        run: |
          npm ci
          npx tauri build --no-bundle

      - name: Collect portable Windows binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-win -Force | Out-Null
          Copy-Item "launcher/src-tauri/target/release/eternum-launcher.exe" "release-win/EternumLauncher-win64.exe" -Force
          Copy-Item "manifest-gen-gui/src-tauri/target/release/eternum-manifest-studio.exe" "release-win/EternumModpackManager-win64.exe" -Force
          if (Test-Path "launcher/src-tauri/target/release/WebView2Loader.dll") {
            Copy-Item "launcher/src-tauri/target/release/WebView2Loader.dll" "release-win/WebView2Loader.dll" -Force
          }
          Get-ChildItem release-win | Select-Object Name, Length

      - name: Upload Windows portable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: release-win/*

  build-windows-win7:
    name: Windows 7 Portable (No WebView2)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust Nightly (Win7 target)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Rust cache (win7)
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "win7-webui"
          workspaces: |
            launcher/src-tauri
            manifest-gen-gui/src-tauri

      - name: Build Eternum Launcher (Win7 WebUI, no WebView2)
        working-directory: launcher/src-tauri
        run: cargo build --release --target x86_64-win7-windows-msvc --no-default-features --features webui -Z build-std

      - name: Build Eternum Modpack Manager (Win7 WebUI, no WebView2)
        working-directory: manifest-gen-gui/src-tauri
        run: cargo build --release --target x86_64-win7-windows-msvc --no-default-features --features webui -Z build-std

      - name: Verify Win7 binaries & collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-win7 -Force | Out-Null
          Copy-Item "launcher/src-tauri/target/x86_64-win7-windows-msvc/release/eternum-launcher.exe" "release-win7/EternumLauncher-win7-x64.exe" -Force
          Copy-Item "manifest-gen-gui/src-tauri/target/x86_64-win7-windows-msvc/release/eternum-manifest-studio.exe" "release-win7/EternumModpackManager-win7-x64.exe" -Force
          Get-ChildItem release-win7 | Select-Object Name, Length

      - name: Check Win7 PE imports (must omit Win8/10+ & WebView2 APIs)
        shell: pwsh
        run: |
          $dumpbin = Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Recurse -Filter "dumpbin.exe" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "Hostx64\\x64" } | Select-Object -First 1
          foreach ($f in Get-ChildItem "release-win7\*.exe") {
            Write-Host "Checking PE imports of $($f.Name)..."
            if ($dumpbin) {
              $imp = & $dumpbin.FullName /IMPORTS $f.FullName | Out-String
              $bad = $imp | Select-String -Pattern "ProcessPrng|WaitOnAddress|GetSystemTimePreciseAsFileTime|WebView2Loader\.dll|combase\.dll|api-ms-win-core-winrt" -AllMatches
              if ($bad) {
                Write-Error "Incompatible Win8/10+ import detected in $($f.Name): $($bad.Matches.Value -join ', ')"
                exit 1
              }
              Write-Host "OK: $($f.Name) has zero forbidden Win8/10+/WebView2 PE imports."
            } else {
              Write-Host "dumpbin.exe not found; skipping PE check."
            }
          }

      - name: Upload Windows 7 portable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-win7-portable
          path: release-win7/*

  build-linux:
    name: Linux Portable (.AppImage)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache (launcher)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "launcher/src-tauri"

      - name: Rust cache (manifest-gen-gui)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "manifest-gen-gui/src-tauri"

      - name: Build Eternum Launcher (AppImage)
        working-directory: launcher
        env:
          NO_STRIP: "true"
        run: |
          npm ci
          npx tauri build --bundles appimage

      - name: Build Eternum Modpack Manager (AppImage)
        working-directory: manifest-gen-gui
        env:
          NO_STRIP: "true"
        run: |
          npm ci
          npx tauri build --bundles appimage

      - name: Collect portable Linux AppImages
        run: |
          mkdir -p release-linux
          LAUNCHER_AI=$(find launcher/src-tauri/target/release/bundle/appimage -maxdepth 1 -name "*.AppImage" | head -n 1)
          MANAGER_AI=$(find manifest-gen-gui/src-tauri/target/release/bundle/appimage -maxdepth 1 -name "*.AppImage" | head -n 1)
          cp "$LAUNCHER_AI" "release-linux/EternumLauncher-linux-x86_64.AppImage"
          cp "$MANAGER_AI" "release-linux/EternumModpackManager-linux-x86_64.AppImage"
          chmod +x release-linux/*.AppImage
          ls -lh release-linux

      - name: Upload Linux portable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-portable
          path: release-linux/*

  build-fedora:
    name: Fedora Native Binary (ELF x86_64)
    runs-on: ubuntu-latest
    container:
      image: fedora:41
    steps:
      - name: Install Fedora Tauri dependencies & toolchain
        run: |
          dnf install -y \
            webkit2gtk4.1-devel \
            openssl-devel \
            curl \
            wget \
            file \
            tar \
            gzip \
            git \
            gcc \
            gcc-c++ \
            pkgconf-pkg-config \
            libappindicator-gtk3-devel \
            librsvg2-devel \
            nodejs \
            npm
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Eternum Launcher (Fedora binary)
        working-directory: launcher
        run: |
          npm ci
          npx tauri build --no-bundle

      - name: Build Eternum Modpack Manager (Fedora binary)
        working-directory: manifest-gen-gui
        run: |
          npm ci
          npx tauri build --no-bundle

      - name: Collect Fedora binaries
        run: |
          mkdir -p release-fedora
          cp "launcher/src-tauri/target/release/eternum-launcher" "release-fedora/EternumLauncher-fedora-x86_64"
          cp "manifest-gen-gui/src-tauri/target/release/eternum-manifest-studio" "release-fedora/EternumModpackManager-fedora-x86_64"
          chmod +x release-fedora/*
          ls -lh release-fedora

      - name: Upload Fedora binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fedora-portable
          path: release-fedora/*

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-windows-win7, build-linux, build-fedora]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository for changelog
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-portable
          path: release-assets

      - name: Download Windows 7 (No WebView2) artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-win7-portable
          path: release-assets

      - name: Download Linux AppImage artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-portable
          path: release-assets

      - name: Download Fedora binary artifacts
        uses: actions/download-artifact@v4
        with:
          name: fedora-portable
          path: release-assets

      - name: Determine release tag & changelog notes
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "name=${TAG}" >> "$GITHUB_OUTPUT"

          CHANGELOG_NOTES=""
          if [ -f CHANGELOG.md ]; then
            CHANGELOG_NOTES=$(awk -v ver="$TAG" '
              /^## \[/ {
                if (found) exit
                if ($0 ~ "\\[" ver "\\]") { found=1; print; next }
              }
              found { print }
            ' CHANGELOG.md)
          fi

          if [ -z "$CHANGELOG_NOTES" ]; then
            PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
            if [ -n "$PREV_TAG" ]; then
              CHANGELOG_NOTES=$(git log --no-merges --pretty=format:"- %s" "${PREV_TAG}..${TAG}" 2>/dev/null || true)
            else
              CHANGELOG_NOTES=$(git log --no-merges -n 15 --pretty=format:"- %s" 2>/dev/null || true)
            fi
          fi

          {
            if [ -n "$CHANGELOG_NOTES" ]; then
              echo "## Что нового в ${TAG}"
              echo ""
              echo "$CHANGELOG_NOTES"
              echo ""
              echo "---"
              echo ""
            fi
            printf '%s\n' \
              "Портативные сборки **Eternum Launcher** и **Eternum Modpack Manager** для **Windows 10/11**, **Windows 7 (без WebView2)** и **Linux** (без установщиков)." \
              "" \
              "### Windows 10/11 (x64)" \
              "- \`EternumLauncher-win64.exe\` — лаунчер для игроков" \
              "- \`EternumModpackManager-win64.exe\` — менеджер сборки для администраторов" \
              "" \
              "### Windows 7 SP1 (x64, без WebView2 — открывает UI в браузере)" \
              "- \`EternumLauncher-win7-x64.exe\` — лаунчер для Windows 7" \
              "- \`EternumModpackManager-win7-x64.exe\` — менеджер сборки для Windows 7" \
              "" \
              "### Fedora / Linux (нативные бинарники)" \
              "- \`EternumLauncher-fedora-x86_64\` — нативный бинарник лаунчера (\`chmod +x\` и \`./EternumLauncher-fedora-x86_64\`)" \
              "- \`EternumModpackManager-fedora-x86_64\` — нативный бинарник менеджера сборки" \
              "" \
              "### Linux (универсальный AppImage)" \
              "- \`EternumLauncher-linux-x86_64.AppImage\` — портативный лаунчер" \
              "- \`EternumModpackManager-linux-x86_64.AppImage\` — портативный менеджер сборки"
          } > release_body.md

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Eternum Launcher & Modpack Manager (${{ steps.tag.outputs.name }})
          body_path: release_body.md
          files: release-assets/*
          fail_on_unmatched_files: true
          make_latest: true

      - name: Sync Release & Assets to GitLab
        if: ${{ success() }}
        continue-on-error: true
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if [ -z "$GITLAB_TOKEN" ]; then
            echo "GITLAB_TOKEN not set; skipping GitLab release sync."
            exit 0
          fi
          TAG="${{ steps.tag.outputs.name }}"
          GL_PROJ="meed0ff%2Feternum-launcher"
          PKG_BASE="https://gitlab.com/api/v4/projects/${GL_PROJ}/packages/generic/eternum/${TAG}"
          LINKS=""
          for f in release-assets/*; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            echo "Uploading $name to GitLab Package Registry..."
            curl --fail --silent --show-error \
              --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
              --upload-file "$f" \
              "${PKG_BASE}/${name}"
            LINK=$(jq -nc --arg name "$name" --arg url "${PKG_BASE}/${name}" '{name: $name, url: $url, link_type: "package"}')
            if [ -z "$LINKS" ]; then
              LINKS="$LINK"
            else
              LINKS="${LINKS},${LINK}"
            fi
          done
          PAYLOAD=$(jq -nc --arg name "Eternum Launcher & Modpack Manager (${TAG})" --arg tag "$TAG" --rawfile desc release_body.md --argjson links "[$LINKS]" '{name: $name, tag_name: $tag, description: $desc, assets: {links: $links}}')
          curl --silent --show-error -X DELETE \
            --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
            "https://gitlab.com/api/v4/projects/${GL_PROJ}/releases/${TAG}" >/dev/null || true
          curl --fail --silent --show-error -X POST \
            --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
            --header "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "https://gitlab.com/api/v4/projects/${GL_PROJ}/releases"
