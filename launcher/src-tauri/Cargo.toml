[package]
name = "eternum-launcher"
version = "1.0.0"
description = "Eternum Minecraft Launcher"
authors = ["Eternum Team"]
edition = "2021"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "reqwest/default-tls"]
webui = ["reqwest/rustls-tls-webpki-roots"]

[build-dependencies]
tauri-build = { version = "2.0.0", optional = true, features = [] }

[dependencies]
tauri = { version = "2.0.0", optional = true, features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
sha2 = "0.10"
hex = "0.4"
futures-util = "0.3"
open = "5"
uuid = { version = "1.8", features = ["v4", "v5"] }
url = "2.5"
urlencoding = "2.1"
dirs = "6.0"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
