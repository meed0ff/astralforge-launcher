[package]
name = "astralforge-launcher"
version = "1.0.0"
description = "AstralForge Minecraft Launcher"
authors = ["AstralForge Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
sha2 = "0.10"
hex = "0.4"
futures-util = "0.3"
open = "5"
uuid = { version = "1.8", features = ["v4", "v5"] }
tiny_http = "0.12"
url = "2.5"
urlencoding = "2.1"
dirs = "5.0"
base64 = "0.22"
