[package]
name = "eternum-manifest-gen"
version = "1.0.0"
edition = "2021"
description = "Standalone manifest.json generator for Eternum modpack"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
urlencoding = "2.1"
ureq = { version = "3.0", default-features = false, features = ["json", "rustls-no-provider", "rustls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-rustcrypto = "0.0.2-alpha"
